name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: deposito_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      NODE_ENV: test
      ALLOW_TEST_DB_RESET: "true"
      PLATFORM_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deposito_ci_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deposito_ci_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/deposito_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Print Versions
        run: |
          node --version
          npm --version

      - name: Guard Database URLs
        run: |
          for url in "$PLATFORM_DATABASE_URL" "$DATABASE_URL" "$DATABASE_URL_TEST"; do
            if [[ ! "$url" =~ "localhost" && ! "$url" =~ "127.0.0.1" ]]; then
              echo "Error: Database URL does not point to localhost."
              exit 1
            fi
            if [[ ! "$url" =~ "_test" ]]; then
              echo "Error: Database URL does not point to a test database."
              exit 1
            fi
          done
          if [[ "$NODE_ENV" != "test" || "$ALLOW_TEST_DB_RESET" != "true" ]]; then
             echo "Error: Safety variables not set properly."
             exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests (Server)
        run: npm --workspace @platform/server run test

      - name: Unit Tests (Client)
        run: npm --workspace @platform/client run test

      - name: Database Migrations
        env:
          PLATFORM_DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: npm --workspace @platform/server run db:migrate

      - name: Verify Constraints PR-C1
        env:
          PLATFORM_DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: |
          node -e "
          const { Client } = require('pg');
          async function verify() {
            const client = new Client({ connectionString: process.env.PLATFORM_DATABASE_URL });
            await client.connect();
            try {
              const constraints = [
                'chk_inv_drogas_cantidad_no_negativa',
                'chk_inv_estuches_cantidad_no_negativa',
                'chk_inv_etiquetas_cantidad_no_negativa',
                'chk_inv_frascos_cajas_no_negativa',
                'chk_inv_frascos_upc_positiva',
                'chk_inv_frascos_total_coherente',
                'chk_movimientos_cantidad_no_cero'
              ];

              const { rows } = await client.query(\`
                SELECT conname, convalidated
                FROM pg_constraint
                JOIN pg_namespace ON pg_namespace.oid = connamespace
                WHERE nspname = 'deposito'
                AND conname = ANY(\$1)
              \`, [constraints]);

              const found = new Set(rows.map(r => r.conname));
              let failed = false;

              for (const name of constraints) {
                if (!found.has(name)) {
                  console.error('Missing constraint:', name);
                  failed = true;
                }
              }

              for (const row of rows) {
                if (!row.convalidated) {
                  console.error('Constraint not validated:', row.conname);
                  failed = true;
                } else {
                  console.log('Constraint OK:', row.conname);
                }
              }

              if (failed) process.exit(1);
            } finally {
              await client.end();
            }
          }
          verify().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Integration Tests
        run: npm --workspace @platform/server run test:integration

      - name: Check Whitespace Commits
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git diff --check ${{ github.event.pull_request.base.sha }} ${{ github.sha }}
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
              BEFORE_SHA=$(git rev-parse HEAD~1)
            fi
            git diff --check $BEFORE_SHA ${{ github.sha }}
          fi

      - name: Final Workspace Cleanliness Check
        run: |
          git restore packages/db/src/generated/client || true
          git diff --exit-code
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            git status --short
            echo "El pipeline dejó el repositorio sucio"
            exit 1
          fi
